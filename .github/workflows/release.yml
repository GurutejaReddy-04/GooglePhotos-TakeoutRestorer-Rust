name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: restorer-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: restorer-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: restorer-macos-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libglib2.0-dev libgtk-3-dev pkg-config exiftool

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      run: |
        brew install exiftool
        rustup target add x86_64-apple-darwin

    - name: Install Windows build dependencies
      if: runner.os == 'Windows'
      run: |
        choco install exiftool

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.75.0
        targets: ${{ matrix.target }}

    - name: Install cargo-packager
      run: cargo install cargo-packager --locked

    - name: Build Release Binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Generate SBOM (CycloneDX)
      run: |
        cargo install cargo-cyclonedx --locked
        cargo cyclonedx -f json --all

    - name: Run Packager
      run: cargo packager --release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          target/${{ matrix.target }}/release/app*
          *.cdx.json
          *.json
