name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: restorer-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: restorer-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: restorer-macos-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libglib2.0-dev libgtk-3-dev pkg-config exiftool

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      run: |
        brew install exiftool
        rustup target add x86_64-apple-darwin

    - name: Install Windows build dependencies
      if: runner.os == 'Windows'
      run: |
        choco install exiftool

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.75.0
        targets: ${{ matrix.target }}

    - name: Install cargo-packager
      run: cargo install cargo-packager --locked

    - name: Build Release Binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Generate SBOM (CycloneDX)
      run: |
        cargo install cargo-cyclonedx --locked
        cargo cyclonedx -f json --all

    - name: Generate macOS ICNS
      if: runner.os == 'macOS'
      run: |
        mkdir assets/icon.iconset
        sips -z 16 16     assets/icon.png --out assets/icon.iconset/icon_16x16.png
        sips -z 32 32     assets/icon.png --out assets/icon.iconset/icon_16x16@2x.png
        sips -z 32 32     assets/icon.png --out assets/icon.iconset/icon_32x32.png
        sips -z 64 64     assets/icon.png --out assets/icon.iconset/icon_32x32@2x.png
        sips -z 128 128   assets/icon.png --out assets/icon.iconset/icon_128x128.png
        sips -z 256 256   assets/icon.png --out assets/icon.iconset/icon_128x128@2x.png
        sips -z 256 256   assets/icon.png --out assets/icon.iconset/icon_256x256.png
        sips -z 512 512   assets/icon.png --out assets/icon.iconset/icon_256x256@2x.png
        sips -z 512 512   assets/icon.png --out assets/icon.iconset/icon_512x512.png
        sips -z 1024 1024 assets/icon.png --out assets/icon.iconset/icon_512x512@2x.png
        iconutil -c icns assets/icon.iconset

    - name: Run Packager
      run: cargo packager --release --target ${{ matrix.target }}

    - name: Stage Artifacts for Upload
      shell: bash
      run: |
        mkdir -p staging
        find target/${{ matrix.target }}/release -maxdepth 1 -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.msi" -o -name "*setup*.exe" -o -name "*.zip" \) -exec cp {} staging/ \;
        for s in *.cdx.json; do
          if [ -f "$s" ]; then
            cp "$s" "staging/sbom-${{ matrix.target }}.cdx.json"
          fi
        done

    - name: Upload Matrix Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-assets-${{ matrix.target }}
        path: staging/*
        retention-days: 1

  publish-release:
    name: Publish Release & Attestations
    runs-on: ubuntu-latest
    needs: build-release
    steps:
    - uses: actions/checkout@v4

    - name: Download All Release Artifacts
      uses: actions/download-artifact@v4
      with:
        path: incoming

    - name: Consolidate Artifacts with Fail-Fast Collision Safeguard
      run: |
        mkdir -p dist
        for dir in incoming/*; do
          if [ -d "$dir" ]; then
            for file in "$dir"/*; do
              filename=$(basename "$file")
              if [ -e "dist/$filename" ]; then
                echo "ERROR: Collision detected! Asset '$filename' already exists in dist/ from another target." >&2
                exit 1
              fi
              cp "$file" "dist/$filename"
            done
          fi
        done
        cd dist
        rm -f SHA256SUMS
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Attest Build Provenance (Sigstore)
      uses: actions/attest@v4
      with:
        subject-path: 'dist/*'

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
