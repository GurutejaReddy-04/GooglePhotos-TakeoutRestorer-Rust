[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "TakeoutRestorer"
path = "src/main.rs"

[dependencies]
app_core = { package = "core", path = "../core" }
downloader = { path = "../downloader" }
shared_ui = { path = "../shared_ui" }
gui = { path = "../gui", optional = true }
directories.workspace = true
clap = { version = "4.4", features = ["derive"] }
ctrlc = "3.4"
rusqlite.workspace = true
fs2 = "0.4.3"

[features]
default = ["gui"]
gui = ["dep:gui"]

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
tempfile = "3.10"

[package.metadata.packager]
name = "takeout-restorer"
product_name = "Takeout Restorer"
identifier = "com.takeoutrestorer.app"
description = "Restores metadata for Google Photos Takeout archives using ExifTool."
copyright = "Copyright (c) 2026 Takeout Restorer Team"
icons = [
    "../../assets/icons/32x32.png",
    "../../assets/icons/64x64.png",
    "../../assets/icons/128x128.png",
    "../../assets/icons/256x256.png",
    "../../assets/icons/512x512.png",
    "../../assets/icon.png",
    "../../assets/icon.ico",
    "../../assets/icon.icns",
]

[package.metadata.packager.nsis]
installer_icon = "../../assets/icon.ico"
header_image = "../../assets/installer_header.bmp"
sidebar_image = "../../assets/installer_sidebar.bmp"

[[package.metadata.packager.binaries]]
path = "TakeoutRestorer"
main = true
