[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "TakeoutRestorer"
path = "src/main.rs"

[dependencies]
app_core = { package = "core", path = "../core" }
downloader = { path = "../downloader" }
shared_ui = { path = "../shared_ui" }
gui = { path = "../gui", optional = true }
directories.workspace = true
clap = { version = "4.4", features = ["derive"] }
ctrlc = "3.4"
rusqlite.workspace = true
fs2 = "0.4.3"

[features]
default = ["gui"]
gui = ["dep:gui"]

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
tempfile = "3.10"

[package.metadata.packager]
name = "google-photos-takeout-restorer"
product_name = "Google Photos Takeout Restorer"
identifier = "com.takeoutrestorer.app"
description = "Restores Google Photos Takeout metadata using ExifTool."
copyright = "Copyright (c) 2026 Takeout Restorer Team"
icons = ["../../assets/icon.png", "../../assets/icon.icns", "../../assets/icon.ico"]

[[package.metadata.packager.binaries]]
path = "TakeoutRestorer"
main = true
