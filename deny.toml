[advisories]
unmaintained = "none"
yanked = "warn"
unused-ignored-advisory = "allow"
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-only",
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
    "CDLA-Permissive-2.0",
    "ODbL-1.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "NCSA"
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
